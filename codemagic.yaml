workflows:
  ghostgram-ios:
    name: Ghostgram iOS — unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      cache:
        cache_paths:
          - ~/.cache/bazel
          - ~/.bazel
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Fetch submodules
        script: |
          git submodule sync --recursive
          git submodule update --init --recursive
      - name: Bootstrap fake certificates
        script: |
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
      - name: Build (release_arm64, fake-codesigning, unsigned)
        script: |
          set -e
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"
    artifacts:
      - bazel-out/**/bin/Telegram/Telegram.ipa
      - bazel-out/**/*.dSYM
