workflows:
  ghostgram-ios:
    name: Ghostgram iOS - unsigned IPA
    max_build_duration: 120
    environment:
      xcode: latest
      cache:
        cache_paths:
          - ~/.cache/bazel
          - ~/.bazel
    scripts:
      - name: Fetch submodules
        script: |
          git submodule sync --recursive
          git submodule update --init --recursive
      - name: Bootstrap fake certificates
        script: |
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
      - name: Refresh expired fake provisioning profiles
        script: |
          bash build-system/ghostgram-refresh-profiles.sh
      - name: Build
        script: |
          bash build-system/ghostgram-build.sh
    artifacts:
      - bazel-out/**/bin/Telegram/Telegram.ipa
      - bazel-out/**/*.dSYM